app_name: sales-hunter
environment: development

sender:
  name: 吉田篤朗
  email: ""  # set in .env as GMAIL_FROM_ADDRESS
  company: 三吉商事
  offer_summary: "AIによる業務効率化支援（営業代行・データ整形・EC登録補助など）"
  call_to_action: "まずは無料でお試しいただけます。30分のオンライン相談も歓迎です。"
  calendar_link: ""

outreach:
  daily_send_limit: 20
  max_followups: 2
  dry_run: false

targeting:
  allowed_industries:
    - IT・SaaS
    - マーケティング
    - 製造業
    - 小売業
    - 人材
    - 不動産
    - コンサルティング
    - EC・通販
    - 広告
  blocked_domains:
    - gmail.com
    - yahoo.co.jp
    - hotmail.com
  blocked_keywords:
    - 詐欺
    - 違法

score_rules:
  has_email: 20
  has_website: 10
  allowed_industry: 15
  notes_keywords:
    外注: 20
    代行: 20
    自動化: 20
    効率化: 20
    マーケ: 15
    営業: 15
    リスト: 15
    入力: 10
  btob_signal: 5
  notes_max_bonus: 40

llm:
  provider: gemini
  model: gemini-2.5-flash

logging:
  level: INFO
  log_dir: data/logs

# Lead Discovery settings
discovery:
  request_timeout_seconds: 10
  request_retry_count: 2
  max_pages_per_site: 3
  delay_between_requests: 1.0
  blocked_domains:
    - gmail.com
    - yahoo.co.jp
    - hotmail.com
    - example.com
  target_industries:
    - IT・SaaS
    - マーケティング
    - 製造業
    - 小売業
    - EC・通販
    - 広告
    - コンサルティング
    - 人材
  target_keywords:
    - 外注
    - 代行
    - 業務効率化
    - 自動化
    - 営業支援
  excluded_keywords:
    - 詐欺
    - 違法
  score_rules:
    has_website: 20
    has_email: 20
    has_contact_page: 15
    likely_b2b: 15
    has_company_page: 10
    likely_outsourcing: 10
    has_phone: 5
    keyword_bonus_per_hit: 5
    keyword_bonus_max: 20
